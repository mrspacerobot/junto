services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: junto
      POSTGRES_USER: junto
      POSTGRES_PASSWORD: junto
    volumes:
      - junto_pgdata:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  # A distinct volume deliberately leaves any historical Onda pgdata untouched.
  junto_pgdata:
