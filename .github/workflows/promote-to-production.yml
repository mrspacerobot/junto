name: Promote to production

# The only path from a published candidate to production. It is manual by
# construction: a person starts it, names the candidate, backup, and expected
# rollback target, types the confirmation, and a reviewer on the `production`
# environment approves before any step runs.
#
# The `prod` tag is the record of what production runs. It moves to a candidate
# only after that candidate reports healthy, so a candidate that fails leaves
# the previous live image available by digest.
#
# Rolling back is this same workflow run against the previous commit.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA of the published release candidate to promote.
        required: true
      backup_reference:
        description: Verified backup this release can be recovered to (for example a Render PITR timestamp or a logical dump identifier).
        required: true
      expected_rollback_target:
        description: Current live Render image digest, or "none (first production release)" when no live deployment exists.
        required: true
      confirm:
        description: Type PROMOTE to confirm this changes production.
        required: true

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: production-promotion
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  promote:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Require protected production approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          environment="$(gh api "repos/$GITHUB_REPOSITORY/environments/production")"
          reviewer_count="$(echo "$environment" | jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length')"
          prevent_self_review="$(echo "$environment" | jq -r '[.protection_rules[]? | select(.type == "required_reviewers")][0].prevent_self_review // false')"
          [ "$reviewer_count" -gt 0 ] || {
            echo "The production environment has no required reviewer protection rule." >&2
            exit 1
          }
          [ "$prevent_self_review" = true ] || {
            echo "The production environment must prevent self-review." >&2
            exit 1
          }

      - name: Confirm the operator means production
        env:
          CONFIRMATION: ${{ inputs.confirm }}
          CANDIDATE_COMMIT: ${{ inputs.commit }}
          EXPECTED_ROLLBACK_TARGET: ${{ inputs.expected_rollback_target }}
        run: |
          if [ "$CONFIRMATION" != "PROMOTE" ]; then
            echo "Confirmation was not PROMOTE. Nothing was changed." >&2
            exit 1
          fi
          if ! [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The candidate commit must be a full lowercase commit SHA." >&2
            exit 1
          fi
          if [ "$EXPECTED_ROLLBACK_TARGET" != "none (first production release)" ] &&
             ! [[ "$EXPECTED_ROLLBACK_TARGET" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "The expected rollback target must be a full image digest or the first-release marker." >&2
            exit 1
          fi

      - name: Require a configured production target
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          test -n "$PRODUCTION_URL" || { echo "The production environment has no PRODUCTION_URL variable." >&2; exit 1; }
          test -n "$RENDER_SERVICE_ID" || { echo "The production environment has no RENDER_SERVICE_ID variable." >&2; exit 1; }
          test -n "$RENDER_API_KEY" || { echo "The production environment has no RENDER_API_KEY secret." >&2; exit 1; }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.commit }}

      - name: Validate the verified backup reference
        env:
          BACKUP_REFERENCE: ${{ inputs.backup_reference }}
        run: ./scripts/render-release-record.sh validate-backup

      - name: Sign in to the container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the published candidate
        id: candidate
        env:
          CANDIDATE_COMMIT: ${{ inputs.commit }}
        run: |
          candidate_tag="$IMAGE_NAME:sha-$CANDIDATE_COMMIT"
          if ! digest="$(docker buildx imagetools inspect "$candidate_tag" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
            echo "No published candidate for commit $CANDIDATE_COMMIT. Only images the release workflow published can be promoted." >&2
            exit 1
          fi

          {
            echo "tag=$candidate_tag"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"

      - name: Read the candidate's recorded identity
        id: identity
        env:
          CANDIDATE_COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The release workflow stamped these onto the image, so they describe
          # the digest being promoted rather than the current sources.
          labels="$(docker buildx imagetools inspect "$IMAGE_NAME@${{ steps.candidate.outputs.digest }}" --format '{{json .Image.Config.Labels}}')"
          revision="$(echo "$labels" | jq -r '."org.opencontainers.image.revision" // ""')"
          version="$(echo "$labels" | jq -r '."org.opencontainers.image.version" // ""')"
          schema_version="$(echo "$labels" | jq -r '."ch.junto.schema.version" // ""')"
          config_version="$(echo "$labels" | jq -r '."ch.junto.config.version" // ""')"
          [ "$revision" = "$CANDIDATE_COMMIT" ] || { echo "The candidate image records revision '$revision', not '$CANDIDATE_COMMIT'." >&2; exit 1; }
          if [ -z "$version" ] || [ -z "$schema_version" ] || [ -z "$config_version" ]; then
            echo "The candidate image is missing application, schema, or configuration identity." >&2
            exit 1
          fi
          release_tag="v${version}-${CANDIDATE_COMMIT:0:7}"
          release="$(gh release view "$release_tag" --json body,isDraft,targetCommitish)" || {
            echo "No candidate release record exists at $release_tag." >&2
            exit 1
          }
          [ "$(echo "$release" | jq -r .targetCommitish)" = "$CANDIDATE_COMMIT" ] || {
            echo "Release $release_tag does not target $CANDIDATE_COMMIT." >&2
            exit 1
          }
          [ "$(echo "$release" | jq -r .isDraft)" = false ] || {
            echo "Release $release_tag is still a draft." >&2
            exit 1
          }
          recorded_digest="$(echo "$release" | jq -r 'try (.body | capture("(?m)^\\| Image digest \\| `(?<digest>sha256:[0-9a-f]{64})` \\|$").digest) catch ""')"
          [ -n "$recorded_digest" ] || {
            echo "Release $release_tag has no valid recorded image digest." >&2
            exit 1
          }
          [ "$recorded_digest" = "${{ steps.candidate.outputs.digest }}" ] || {
            echo "Commit tag ${{ steps.candidate.outputs.tag }} resolves to '${{ steps.candidate.outputs.digest }}', not recorded digest '$recorded_digest'." >&2
            exit 1
          }
          {
            echo "digest=$recorded_digest"
            echo "version=$version"
            echo "schema_version=$schema_version"
            echo "config_version=$config_version"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the expected rollback target is currently live
        id: rollback
        env:
          EXPECTED_ROLLBACK_TARGET: ${{ inputs.expected_rollback_target }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          live_deploys="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header 'Accept: application/json' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?status=live&limit=1")"
          echo "$live_deploys" | jq -e 'type == "array"' >/dev/null
          if [ "$(echo "$live_deploys" | jq length)" -eq 0 ]; then
            live_target="none (first production release)"
          else
            live_target="$(echo "$live_deploys" | jq -er '.[0].deploy.image.sha | select(type == "string" and test("^sha256:[0-9a-f]{64}$"))')"
          fi
          [ "$live_target" = "$EXPECTED_ROLLBACK_TARGET" ] || {
            echo "Production currently runs '$live_target', not expected rollback target '$EXPECTED_ROLLBACK_TARGET'." >&2
            exit 1
          }
          echo "target=$live_target" >> "$GITHUB_OUTPUT"

      - name: Deploy the exact candidate digest and wait for Render's health gate
        id: deploy
        env:
          CANDIDATE_DIGEST: ${{ steps.identity.outputs.digest }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          api="https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"
          image="$IMAGE_NAME@$CANDIDATE_DIGEST"
          payload="$(jq -cn --arg imageUrl "$image" '{imageUrl: $imageUrl}')"

          list_deploys() {
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header 'Accept: application/json' \
              "$api?limit=100"
          }

          find_candidate_deploys() {
            list_deploys | jq -c \
              --argjson known "$known_deploy_ids" \
              --arg digest "$CANDIDATE_DIGEST" \
              --arg image "$image" '
                [.[].deploy
                  | select(.trigger == "api" and (.image.sha == $digest or .image.ref == $image))
                  | select(.id as $id | (($known | index($id)) == null))]
                | sort_by(.createdAt)
              '
          }

          recover_candidate_deploys() {
            local attempt matches
            for attempt in $(seq 1 12); do
              if matches="$(find_candidate_deploys)" && [ "$(echo "$matches" | jq length)" -gt 0 ]; then
                echo "$matches"
                return 0
              fi
              echo "attempt $attempt: waiting for Render to expose the accepted deployment" >&2
              sleep 5
            done
            return 1
          }

          retrieve_deploy() {
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header 'Accept: application/json' \
              "$api/$1"
          }

          cancel_and_wait() {
            local deployed_digest deployment id status
            id="$1"
            deployment="$(retrieve_deploy "$id" 2>/dev/null || true)"
            status="$(echo "$deployment" | jq -r '.status // empty' 2>/dev/null || true)"
            case "$status" in
              live)
                deployed_digest="$(echo "$deployment" | jq -r '.image.sha // ""')"
                if [ "$deployed_digest" = "$CANDIDATE_DIGEST" ]; then
                  echo "deploy_id=$id" >> "$GITHUB_OUTPUT"
                  echo "result=Render deploy $id reached live after its health gate" >> "$GITHUB_OUTPUT"
                  return 2
                fi
                echo "Render deploy $id reached live with unexpected digest '$deployed_digest'." >&2
                return 1
                ;;
              build_failed | update_failed | pre_deploy_failed | canceled | deactivated)
                return 0
                ;;
            esac

            if ! curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header 'Accept: application/json' \
              "$api/$id/cancel" >/dev/null; then
              echo "Render did not immediately accept cancellation for deploy $id; checking its terminal state." >&2
            fi

            for _ in $(seq 1 20); do
              sleep 3
              if ! deployment="$(retrieve_deploy "$id")"; then
                continue
              fi
              status="$(echo "$deployment" | jq -r '.status // empty')"
              case "$status" in
                live)
                  deployed_digest="$(echo "$deployment" | jq -r '.image.sha // ""')"
                  if [ "$deployed_digest" = "$CANDIDATE_DIGEST" ]; then
                    echo "deploy_id=$id" >> "$GITHUB_OUTPUT"
                    echo "result=Render deploy $id reached live after its health gate" >> "$GITHUB_OUTPUT"
                    return 2
                  fi
                  echo "Render deploy $id reached live with unexpected digest '$deployed_digest'." >&2
                  return 1
                  ;;
                build_failed | update_failed | pre_deploy_failed | canceled | deactivated)
                  echo "Render deploy $id is terminal with status $status."
                  return 0
                  ;;
              esac
            done
            echo "Render deploy $id could not be confirmed canceled or otherwise non-live." >&2
            return 1
          }

          deployment_accepted=false
          deploy_id=""
          known_deploy_ids="$(list_deploys | jq -c '[.[].deploy.id]')"

          cleanup_on_exit() {
            local exit_code=$?
            local any_live cleanup_failed cleanup_result ids matches
            trap - EXIT
            if [ "$exit_code" -eq 0 ] || [ "$deployment_accepted" != true ]; then
              exit "$exit_code"
            fi

            set +e
            ids="$deploy_id"
            if [ -z "$ids" ]; then
              if matches="$(recover_candidate_deploys)"; then
                ids="$(echo "$matches" | jq -r '.[].id')"
              fi
            fi

            any_live=false
            cleanup_failed=false
            if [ -z "$ids" ]; then
              echo "Render accepted the deployment, but its ID could not be recovered for cancellation." >&2
              cleanup_failed=true
            else
              while IFS= read -r id; do
                [ -n "$id" ] || continue
                cancel_and_wait "$id"
                cleanup_result=$?
                case "$cleanup_result" in
                  0) ;;
                  2) any_live=true ;;
                  *) cleanup_failed=true ;;
                esac
              done <<< "$ids"
            fi

            if [ "$any_live" = true ]; then
              echo "The exact candidate reached live while failure recovery was running; continuing promotion bookkeeping."
              exit 0
            fi
            if [ "$cleanup_failed" = true ]; then
              echo "The workflow could not prove every accepted candidate deployment reached a non-live terminal state." >&2
            fi
            exit "$exit_code"
          }
          trap cleanup_on_exit EXIT

          response_file="$RUNNER_TEMP/render-deploy-response.json"
          deployment_accepted=true
          if ! http_status="$(curl --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            --output "$response_file" \
            --write-out '%{http_code}' \
            "$api")"; then
            echo "The Render deploy request ended without a definitive response; recovering any accepted deployment." >&2
            exit 1
          fi
          case "$http_status" in
            201 | 202) ;;
            400 | 401 | 404 | 406 | 409 | 410 | 429)
              deployment_accepted=false
              echo "Render rejected the deploy request with HTTP $http_status." >&2
              exit 1
              ;;
            *)
              echo "Render returned ambiguous HTTP $http_status; recovering any accepted deployment." >&2
              exit 1
              ;;
          esac

          if [ -s "$response_file" ]; then
            deploy_id="$(jq -r '.id // empty' "$response_file")"
          fi
          if [ -z "$deploy_id" ]; then
            matches="$(recover_candidate_deploys)"
            match_count="$(echo "$matches" | jq length)"
            [ "$match_count" -eq 1 ] || {
              echo "Render exposed $match_count new API deployments for the candidate; refusing to guess which request was accepted." >&2
              exit 1
            }
            deploy_id="$(echo "$matches" | jq -r '.[0].id')"
          fi
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

          deadline=$(( SECONDS + 600 ))
          attempt=0
          until [ "$SECONDS" -ge "$deadline" ]; do
            attempt=$(( attempt + 1 ))
            deployment="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header 'Accept: application/json' \
              "$api/$deploy_id")"
            status="$(echo "$deployment" | jq -er .status)"
            case "$status" in
              live)
                deployed_digest="$(echo "$deployment" | jq -r '.image.sha // ""')"
                [ "$deployed_digest" = "$CANDIDATE_DIGEST" ] || {
                  echo "Render reported live digest '$deployed_digest', not '$CANDIDATE_DIGEST'." >&2
                  exit 1
                }
                echo "result=Render deploy $deploy_id reached live after its health gate" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              build_failed | update_failed | pre_deploy_failed | canceled | deactivated)
                echo "Render deploy $deploy_id ended with status $status. The prior live deployment was not replaced." >&2
                exit 1
                ;;
              created | queued | build_in_progress | pre_deploy_in_progress | update_in_progress)
                echo "attempt $attempt: Render deploy $deploy_id is $status"
                ;;
              *)
                echo "Render deploy $deploy_id returned unknown status '$status'." >&2
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "Render deploy $deploy_id did not pass its health gate within 10 minutes. The prod tag was not moved." >&2
          exit 1

      - name: Move the production tag to the promoted digest
        id: production_tag
        run: |
          # Retags the exact digest that was verified; it is never rebuilt.
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:prod" \
            "$IMAGE_NAME@${{ steps.identity.outputs.digest }}"
          echo "moved=true" >> "$GITHUB_OUTPUT"

      - name: Record the promotion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.identity.outputs.release_tag }}
          COMMIT: ${{ inputs.commit }}
          IMAGE_REFERENCE: ${{ steps.candidate.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.identity.outputs.digest }}
          APP_VERSION: ${{ steps.identity.outputs.version }}
          SCHEMA_VERSION: ${{ steps.identity.outputs.schema_version }}
          CONFIG_VERSION: ${{ steps.identity.outputs.config_version }}
          ROLLBACK_TARGET: ${{ steps.rollback.outputs.target }}
          PREVIOUS_PRODUCTION_DIGEST: ${{ steps.rollback.outputs.target }}
          BACKUP_REFERENCE: ${{ inputs.backup_reference }}
          PROMOTED_BY: ${{ github.actor }}
          HEALTH_CHECK_RESULT: ${{ steps.deploy.outputs.result }}
          VULNERABILITY_SUMMARY: recorded on the candidate release
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ./scripts/render-release-record.sh promotion > "$RUNNER_TEMP/promotion-record.md"
          cat "$RUNNER_TEMP/promotion-record.md" >> "$GITHUB_STEP_SUMMARY"
          gh release edit "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/promotion-record.md" \
            --prerelease=false \
            --latest

      - name: Report the rollback target if the promotion failed
        if: failure()
        env:
          PRODUCTION_TAG_MOVED: ${{ steps.production_tag.outputs.moved }}
        run: |
          {
            echo "### Promotion did not complete"
            echo ""
            if [ "$PRODUCTION_TAG_MOVED" = true ]; then
              echo "The candidate reached Render and the \`prod\` tag moved, but recording the promotion failed."
            else
              echo "The \`prod\` tag was not moved."
            fi
            echo "The prior image remains available at \`${{ steps.rollback.outputs.target }}\`."
            echo "If Render did not report the candidate live, its health gate kept the prior deployment serving. If a later bookkeeping step failed, redeploy the rollback target through this workflow."
            echo "The candidate \`${{ steps.identity.outputs.digest }}\` remains published and can be promoted again once the cause is understood."
          } >> "$GITHUB_STEP_SUMMARY"
