plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java-test-fixtures'
    id 'org.springdoc.openapi-gradle-plugin' version '1.9.0'
    id 'com.diffplug.spotless' version '7.0.2'
}

group = 'ch.junto'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

spotless {
    java {
        target fileTree(projectDir) {
            include 'src/**/*.java'
        }
        googleJavaFormat('1.25.2')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.postgresql:postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
    implementation 'io.github.aytronnfr:jts-jackson3-module:0.1.0'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    implementation 'org.hibernate.orm:hibernate-spatial'

    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-test'
    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-security'
    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testFixturesImplementation 'org.testcontainers:testcontainers-postgresql'
    testFixturesImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testFixturesImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testFixturesImplementation 'org.hibernate.orm:hibernate-spatial'
}

def frontendDirectory = file('../frontend')
def suppliedFrontendDist = providers.gradleProperty('frontendDistDir')
def frontendDist = suppliedFrontendDist.map { file(it) }.orElse(file('../frontend/dist'))
def generatedFrontendResources = layout.buildDirectory.dir('generated/frontend/static')
def npmCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'

tasks.register('frontendInstall', Exec) {
    description = 'Installs the pinned frontend dependencies.'
    group = 'build'
    workingDir frontendDirectory
    commandLine npmCommand, 'ci'
    inputs.files(file('../frontend/package.json'), file('../frontend/package-lock.json'), file('../frontend/openapi-ts.config.ts'), file('../docs/openapi.json'))
    outputs.files(file('../frontend/node_modules/.package-lock.json'), file('../frontend/src/api/generated/sdk.gen.ts'))
    onlyIf { !suppliedFrontendDist.isPresent() }
}

tasks.register('frontendBuild', Exec) {
    description = 'Builds the Vue application for inclusion in the Spring Boot artifact.'
    group = 'build'
    dependsOn tasks.named('frontendInstall')
    workingDir frontendDirectory
    commandLine npmCommand, 'run', 'build'
    inputs.files(fileTree(frontendDirectory) {
        exclude 'dist/**', 'node_modules/**', 'e2e/**', 'playwright-report/**', 'test-results/**'
    })
    outputs.dir(file('../frontend/dist'))
    onlyIf { !suppliedFrontendDist.isPresent() }
}

tasks.register('syncFrontend', Sync) {
    description = 'Stages a built Vue application as Spring Boot static resources.'
    group = 'build'
    if (!suppliedFrontendDist.isPresent()) {
        dependsOn tasks.named('frontendBuild')
    }
    from(frontendDist)
    into(generatedFrontendResources)
    doFirst {
        if (!new File(frontendDist.get(), 'index.html').isFile()) {
            throw new GradleException("Frontend distribution at ${frontendDist.get()} has no index.html")
        }
    }
}

tasks.named('processResources') {
    dependsOn tasks.named('syncFrontend')
    from(generatedFrontendResources) {
        into 'static'
    }
}

// --- Release identity -------------------------------------------------------
// Every value below is derived from committed sources alone, so the same commit
// always yields the same identity whether the build runs in CI or inside the
// production image build (which receives no .git directory). The commit itself
// is therefore carried by the image tag and OCI labels rather than by the JAR;
// see docs/operations/release-and-promotion.md.

def migrationDirectory = file('src/main/resources/db/migration')

// The configuration inputs whose content defines the release's configuration
// version. Add a file here when it becomes part of the production configuration
// contract; a change to any of them produces a new configuration version.
def productionConfigurationFiles = [
    file('src/main/resources/application.yml'),
    file('src/main/resources/application-prod.yml'),
]

def flywaySchemaVersion = {
    def migrations = migrationDirectory.listFiles()
    if (migrations == null) {
        throw new GradleException("No Flyway migration directory at ${migrationDirectory}")
    }
    def versions = migrations
        .collect { (it.name =~ /^V(\d+(?:[._]\d+)*)__/) }
        .findAll { it.find() }
        .collect { version ->
            version.group(1).tokenize('._')*.toInteger().join('.')
        }
    if (versions.isEmpty()) {
        throw new GradleException("No Flyway migrations found in ${migrationDirectory}")
    }
    versions.max { left, right ->
        def leftParts = left.tokenize('.')*.toInteger()
        def rightParts = right.tokenize('.')*.toInteger()
        def width = Math.max(leftParts.size(), rightParts.size())
        for (int index = 0; index < width; index++) {
            def comparison = (leftParts[index] ?: 0) <=> (rightParts[index] ?: 0)
            if (comparison != 0) {
                return comparison
            }
        }
        0
    }
}()

def productionConfigurationVersion = {
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    productionConfigurationFiles.sort { it.name }.each { configurationFile ->
        if (!configurationFile.isFile()) {
            throw new GradleException("Production configuration input is missing: ${configurationFile}")
        }
        digest.update("${configurationFile.name}\n".getBytes('UTF-8'))
        digest.update(configurationFile.bytes)
    }
    digest.digest().encodeHex().toString().substring(0, 12)
}()

springBoot {
    buildInfo {
        // A build timestamp would make two builds of one commit differ and
        // defeat the reproducible production image.
        excludes = ['time']
        properties {
            additional = [
                'schema.version': flywaySchemaVersion,
                'config.version': productionConfigurationVersion,
            ]
        }
    }
}

tasks.register('releaseMetadata') {
    description = 'Prints the deterministic release identity of the current sources as JSON.'
    group = 'build'
    def metadata = [
        version: project.version.toString(),
        schemaVersion: flywaySchemaVersion,
        configVersion: productionConfigurationVersion,
    ]
    doLast {
        println groovy.json.JsonOutput.toJson(metadata)
    }
}

// The packaged archive is a production artifact: development and test-only
// profiles, seed migrations, and profile-gated bypass endpoints never enter it.
// Local development and the end-to-end suite run through `bootRun`, which uses
// the compiled classes rather than this archive, so they are unaffected.
def developmentOnlyResourcePatterns = [
    '**/application-dev.yml',
    '**/application-openapi.yml',
    '**/application-test.yml',
    '**/db/migration-dev/**',
]

def developmentProfileClassPrefixes = providers.provider {
    fileTree('src/main/java') { include '**/*.java' }
        .filter { it.text.contains('@Profile("dev")') }
        .collect {
            def relativePath = file('src/main/java').toPath().relativize(it.toPath()).toString()
            relativePath.replace(File.separator, '/') - ~/\.java$/
        }
}

tasks.named('bootJar') {
    exclude developmentOnlyResourcePatterns
    def excludedClassPrefixes = developmentProfileClassPrefixes
    exclude { element ->
        excludedClassPrefixes.get().any { prefix ->
            element.path.endsWith("${prefix}.class") || element.path.contains("${prefix}\$")
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

openApi {
    apiDocsUrl.set("http://localhost:8080/v3/api-docs")
    outputDir.set(file("../docs"))
    outputFileName.set("openapi.json")
    customBootRun {
        args.set([
            "--spring.profiles.active=openapi",
            "--spring.datasource.url=${System.getenv('OPENAPI_DATABASE_URL') ?: 'jdbc:postgresql://localhost:5432/junto'}",
            "--spring.datasource.username=${System.getenv('OPENAPI_DATABASE_USER') ?: 'junto'}",
            "--spring.datasource.password=${System.getenv('OPENAPI_DATABASE_PASSWORD') ?: 'junto'}",
            "--spring.main.banner-mode=off"
        ])
    }
}
