plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java-test-fixtures'
    id 'org.springdoc.openapi-gradle-plugin' version '1.9.0'
}

group = 'ch.junto'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.postgresql:postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
    implementation 'io.github.aytronnfr:jts-jackson3-module:0.1.0'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    implementation 'org.hibernate.orm:hibernate-spatial'

    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-test'
    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-security'
    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testFixturesImplementation 'org.testcontainers:testcontainers-postgresql'
    testFixturesImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testFixturesImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testFixturesImplementation 'org.hibernate.orm:hibernate-spatial'
}

def frontendDirectory = file('../frontend')
def suppliedFrontendDist = providers.gradleProperty('frontendDistDir')
def frontendDist = suppliedFrontendDist.map { file(it) }.orElse(file('../frontend/dist'))
def generatedFrontendResources = layout.buildDirectory.dir('generated/frontend/static')
def npmCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'

tasks.register('frontendInstall', Exec) {
    description = 'Installs the pinned frontend dependencies.'
    group = 'build'
    workingDir frontendDirectory
    commandLine npmCommand, 'ci'
    inputs.files(file('../frontend/package.json'), file('../frontend/package-lock.json'), file('../frontend/openapi-ts.config.ts'), file('../docs/openapi.json'))
    outputs.files(file('../frontend/node_modules/.package-lock.json'), file('../frontend/src/api/generated/sdk.gen.ts'))
    onlyIf { !suppliedFrontendDist.isPresent() }
}

tasks.register('frontendBuild', Exec) {
    description = 'Builds the Vue application for inclusion in the Spring Boot artifact.'
    group = 'build'
    dependsOn tasks.named('frontendInstall')
    workingDir frontendDirectory
    commandLine npmCommand, 'run', 'build'
    inputs.files(fileTree(frontendDirectory) {
        exclude 'dist/**', 'node_modules/**', 'e2e/**', 'playwright-report/**', 'test-results/**'
    })
    outputs.dir(file('../frontend/dist'))
    onlyIf { !suppliedFrontendDist.isPresent() }
}

tasks.register('syncFrontend', Sync) {
    description = 'Stages a built Vue application as Spring Boot static resources.'
    group = 'build'
    if (!suppliedFrontendDist.isPresent()) {
        dependsOn tasks.named('frontendBuild')
    }
    from(frontendDist)
    into(generatedFrontendResources)
    doFirst {
        if (!new File(frontendDist.get(), 'index.html').isFile()) {
            throw new GradleException("Frontend distribution at ${frontendDist.get()} has no index.html")
        }
    }
}

tasks.named('processResources') {
    dependsOn tasks.named('syncFrontend')
    from(generatedFrontendResources) {
        into 'static'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootJar') {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

openApi {
    apiDocsUrl.set("http://localhost:8080/v3/api-docs")
    outputDir.set(file("../docs"))
    outputFileName.set("openapi.json")
    customBootRun {
        args.set([
            "--spring.profiles.active=openapi",
            "--spring.datasource.url=${System.getenv('OPENAPI_DATABASE_URL') ?: 'jdbc:postgresql://localhost:5432/junto'}",
            "--spring.datasource.username=${System.getenv('OPENAPI_DATABASE_USER') ?: 'junto'}",
            "--spring.datasource.password=${System.getenv('OPENAPI_DATABASE_PASSWORD') ?: 'junto'}",
            "--spring.main.banner-mode=off"
        ])
    }
}
