server:
  # Providers inject the listen port; 8080 is the local default.
  port: ${PORT:8080}
  address: 0.0.0.0
  forward-headers-strategy: none
  servlet:
    session:
      cookie:
        # Spring Session issues this cookie, not JSESSIONID. Logout deletion in
        # SecurityConfig reads the name from here.
        name: SESSION
        http-only: true
        same-site: lax

spring:
  application:
    name: junto
  session:
    jdbc:
      initialize-schema: never
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
  springdoc:
    api-docs:
      path: /v3/api-docs

app:
  allowed-origin: http://localhost:5173
  base-url: http://localhost:5173
  scheduling:
    enabled: true

logging:
  level:
    ch.junto: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
