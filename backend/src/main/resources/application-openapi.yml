server:
  # The OpenAPI Gradle task scrapes a fixed http://localhost:8080, so this
  # profile pins the port instead of reading an injected PORT.
  port: 8080

spring:
  jpa:
    hibernate:
      ddl-auto: validate
  session:
    jdbc:
      initialize-schema: never
  flyway:
    enabled: true
    locations: classpath:db/migration
app:
  allowed-origin: http://localhost:5173
  base-url: http://localhost:5173
  scheduling:
    enabled: false
  security:
    csrf:
      enabled: false
logging:
  level:
    org.hibernate.SQL: WARN
