spring:
  jpa:
    hibernate:
      ddl-auto: validate
  session:
    jdbc:
      initialize-schema: never
  flyway:
    enabled: true
    locations: classpath:db/migration
app:
  allowed-origin: http://localhost:5173
  base-url: http://localhost:5173
  scheduling:
    enabled: false
  security:
    csrf:
      enabled: false
logging:
  level:
    org.hibernate.SQL: WARN
