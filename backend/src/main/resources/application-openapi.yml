server:
  # The OpenAPI Gradle task scrapes a fixed http://localhost:8080, so this
  # profile pins the port instead of reading an injected PORT.
  port: 8080

spring:
  jpa:
    hibernate:
      ddl-auto: validate
  session:
    jdbc:
      initialize-schema: never
  flyway:
    enabled: true
    locations: classpath:db/migration
app:
  allowed-origin: http://localhost:5173
  base-url: http://localhost:5173
  scheduling:
    enabled: false
  security:
    csrf:
      enabled: false
springdoc:
  # Jackson discovers getter-only properties (for example InviteCode.isUsed) in
  # unspecified reflection order, so the emitted document otherwise varies between
  # machines and fails the committed-contract check. Sorting every generated key
  # makes the contract byte-reproducible.
  writer-with-order-by-keys: true
logging:
  level:
    org.hibernate.SQL: WARN
