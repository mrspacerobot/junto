spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  session:
    jdbc:
      initialize-schema: never
  mail:
    host: localhost
    port: 1025
app:
  allowed-origin: http://localhost:5173
  base-url: http://localhost:5173
  scheduling:
    enabled: false
  security:
    csrf:
      enabled: false
